<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>#Eat Rider</title>
  <meta name="theme-color" content="#242424">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23E63946'/%3E%3Ctext x='50%25' y='56%25' dominant-baseline='middle' text-anchor='middle' font-family='Arial Black,Arial' font-weight='900' font-size='38' fill='%23fff'%3E%23%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- fonts load in the background so they never hold up the page -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"></noscript>
  <link rel="stylesheet" href="assets/css/rider.css?v=20261010r">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="r-phone" viewBox="0 0 24 24"><path d="M5 4h4l2 5-3 2a11 11 0 005 5l2-3 5 2v4a2 2 0 01-2 2A17 17 0 013 6a2 2 0 012-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="r-nav" viewBox="0 0 24 24"><path d="M3 11l18-8-8 18-2-8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="r-pin" viewBox="0 0 24 24"><path d="M12 22s7-7.5 7-13a7 7 0 10-14 0c0 5.5 7 13 7 13z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="9" r="2.5" fill="currentColor"/></symbol>
  <symbol id="r-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="r-scooter" viewBox="0 0 48 48"><circle cx="12" cy="36" r="6" fill="none" stroke="currentColor" stroke-width="3.4"/><circle cx="37" cy="36" r="6" fill="none" stroke="currentColor" stroke-width="3.4"/><path d="M12 36h14l6-14h6M30 14h6l4 22M6 26h14v6" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="4" y="14" width="14" height="10" rx="2" fill="currentColor"/></symbol>
  <symbol id="r-out" viewBox="0 0 24 24"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="r-note" viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 9h8M8 13h8M8 17h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="r-cash" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
</svg>

<!-- login -->
<section class="login" id="login" hidden>
  <form onsubmit="return false" class="login-card" id="loginForm" novalidate>
    <img class="logo" src="assets/img/logo.svg" alt="#Eat">
    <h1>Rider app</h1>
    <p>Log in with your mobile number and the PIN from your manager.</p>
    <input name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="Mobile number (03XX XXXXXXX)" required>
    <input name="pin" type="password" inputmode="numeric" pattern="\d{4}" maxlength="4" autocomplete="current-password" placeholder="4-digit PIN" required>
    <button class="btn btn-red" type="submit">Log in</button>
    <p class="err" id="loginErr" role="alert"></p>
  </form>
</section>

<!-- app -->
<div class="app" id="app" hidden>
  <header class="top">
    <img class="logo sm" src="assets/img/logo.svg" alt="#Eat">
    <div class="who"><b id="rName">Rider</b><span id="rSub"></span></div>
    <label class="online" title="Go online / offline"><input type="checkbox" id="onlineToggle"><span class="sw"></span><b id="onlineLabel">Online</b></label>
    <button class="ibtn" id="logoutBtn" type="button" aria-label="Log out"><svg><use href="#r-out"/></svg></button>
  </header>

  <div class="stats">
    <div><span>Active</span><b id="sActive">0</b></div>
    <div><span>Delivered today</span><b id="sDone">0</b></div>
    <div><span>Cash collected</span><b id="sCash">Rs 0</b></div>
  </div>

  <h2 class="sec">My deliveries</h2>
  <div id="activeList"></div>

  <h2 class="sec">Delivered today</h2>
  <div id="doneList"></div>
</div>

<!-- confirm delivered -->
<div class="sheet-wrap" id="confirmSheet" hidden>
  <div class="sheet">
    <div class="grab"></div>
    <h3>Mark <span id="cId"></span> as delivered?</h3>
    <div class="collect"><svg><use href="#r-cash"/></svg><div><span>Collect from customer</span><b id="cTotal">Rs 0</b></div></div>
    <label class="cash-check"><input type="checkbox" id="cashOk"><span>I have collected the cash</span></label>
    <button class="btn btn-green btn-big" id="confirmYes" type="button" disabled>Yes, delivered</button>
    <button class="btn btn-ghost" id="confirmNo" type="button">Cancel</button>
  </div>
</div>

<div class="done-burst" id="doneBurst" hidden><div class="tick"><svg><use href="#r-check"/></svg></div><b>Delivered!</b><span>The restaurant has been notified.</span></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/js/menu.js?v=20261010r"></script>
<script src="assets/js/core.js?v=20261010r"></script>
<script src="assets/js/api.js?v=20261010r"></script>
<script src="assets/js/rider.js?v=20261010r"></script>
</body>
</html>
